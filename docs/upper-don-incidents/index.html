const TYPES = {"Broken bone(s)": "#db4436", "Injury": "#f8971b", "No injury": "#009d57"};

const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "&copy; OpenStreetMap contributors, tiles style by Humanitarian OpenStreetMap Team hosted by OpenStreetMap France"}).addTo(map);
const b = L.geoJSON(BOUNDARY, {style: {color: "#3366cc", weight: 2, fillOpacity: 0.05}}).addTo(map);
map.fitBounds(b.getBounds());

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const layers = {};
for (const t in TYPES) layers[t] = L.layerGroup().addTo(map);
for (const p of POINTS) {
  L.circleMarker([p.lat, p.lon], {radius: 6, color: "#fff", weight: 1, fillColor: TYPES[p.sev], fillOpacity: 0.9})
    .bindPopup(`<b>${esc(p.sev)}</b><br>${esc(p.name)}${p.desc ? "<br><i>" + esc(p.desc) + "</i>" : ""}<br><small>ID ${p.id}</small>`)
    .addTo(layers[p.sev]);
}

const filters = document.getElementById("filters");
function updateTotal() {
  document.getElementById("total").textContent =
    POINTS.filter(p => map.hasLayer(layers[p.sev])).length;
}
for (const t in TYPES) {
  const n = POINTS.filter(p => p.sev === t).length;
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${TYPES[t]}"></span>${t}: <b>${n}</b>`;
  l.querySelector("input").onchange = e => { e.target.checked ? layers[t].addTo(map) : map.removeLayer(layers[t]); updateTotal(); };
  filters.appendChild(l);
}
updateTotal();
